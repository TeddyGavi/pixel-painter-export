<!doctype html>
<!-- QR export page. The bead pad shows a QR code for <this page>#<pattern>; the phone
     opens it with its own internet connection. The pattern lives only in the URL
     fragment, which browsers never send to the server. Format v1 (main/export.c):
       #1.<brand key>.<n>.<code>:<rrggbb>,<code>:<rrggbb>,...<.><cells>
     cells: n*n chars, row-major; '0' = empty, CELL_CHARS[k] = k-th listed colour. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bead Pattern</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
    --accent: #2f5bd3; --accent-ink: #ffffff; --board: #ecebe7; --hole: #d9d7d1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --card: #1e1e21; --ink: #f2f2f4; --muted: #9a9aa2; --line: #2e2e33;
      --accent: #7aa2ff; --accent-ink: #0d1530; --board: #2a2a2e; --hole: #3a3a40;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
  header h1 { font-size: 22px; margin: 0; }
  header p { margin: 2px 0 16px; color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  canvas#pattern { display: block; width: 100%; height: auto; border-radius: 8px; }
  .actions { display: flex; gap: 8px; margin: 12px 0 20px; flex-wrap: wrap; }
  button {
    flex: 1 1 140px; font: inherit; font-weight: 600; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  h2 { font-size: 16px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  h2 span { color: var(--muted); font-weight: 400; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 28px 30px 1fr auto; align-items: center; gap: 10px;
       padding: 8px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .key { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .sw { width: 28px; height: 28px; border-radius: 7px; box-shadow: inset 0 0 0 1px #0002; }
  .code { font-weight: 700; }
  .name { color: var(--muted); font-size: 14px; }
  .count { font-weight: 700; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: var(--muted); padding: 40px 12px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink);
           color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0;
           transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header><h1 id="title">Bead pattern</h1><p id="sub"></p></header>
  <div id="app"></div>
</main>
<div class="toast" id="toast"></div>
<script src="names.js" onerror="window.BEAD_NAMES={}"></script>
<script>
"use strict";
const CELL_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_";
const BRANDS = { hama: "Hama", artkal: "Artkal S", miyuki: "Miyuki Delica" };

function parse(hash) {
  const parts = decodeURIComponent(hash.replace(/^#/, "")).split(".");
  if (parts.length !== 5 || parts[0] !== "1") return null;
  const [, key, nStr, list, cells] = parts;
  const n = parseInt(nStr, 10);
  if (!(n > 0 && n <= 64) || cells.length !== n * n) return null;
  const names = (window.BEAD_NAMES || {})[key] || {};
  const colors = list ? list.split(",").map(s => {
    const i = s.lastIndexOf(":");
    const code = s.slice(0, i), hex = s.slice(i + 1);
    if (i < 1 || !/^[0-9a-f]{6}$/i.test(hex)) throw new Error("bad colour " + s);
    return { code, rgb: "#" + hex.toLowerCase(), name: names[code] || "", count: 0 };
  }) : [];
  const grid = [];
  for (const ch of cells) {
    const k = CELL_CHARS.indexOf(ch);
    if (k < 0 || k > colors.length) return null;
    grid.push(k ? k - 1 : -1);
    if (k) colors[k - 1].count++;
  }
  return { key, brand: BRANDS[key] || key, n, colors, grid };
}

function luma(hex) {
  const v = parseInt(hex.slice(1), 16);
  return (0.299 * (v >> 16) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255)) / 255;
}

// Legend order: most beads first; key numbers follow that order.
function legend(p) {
  return p.colors.map((c, i) => ({ ...c, idx: i }))
    .filter(c => c.count > 0)
    .sort((a, b) => b.count - a.count || a.code.localeCompare(b.code))
    .map((c, j) => ({ ...c, key: j + 1 }));
}

// Draw the pattern (and optionally the legend, for the saved image) on a canvas.
function draw(canvas, p, leg, withLegend) {
  const css = getComputedStyle(document.documentElement);
  const board = withLegend ? "#ecebe7" : css.getPropertyValue("--board").trim();
  const hole = withLegend ? "#d9d7d1" : css.getPropertyValue("--hole").trim();
  const cell = 64, pad = 16, size = p.n * cell + pad * 2;
  const keyOf = {}; leg.forEach(c => keyOf[c.idx] = c.key);
  const rowH = 44, legH = withLegend ? 72 + leg.length * rowH + 24 : 0;
  canvas.width = size; canvas.height = size + legH;
  const x = canvas.getContext("2d");
  if (withLegend) { x.fillStyle = "#ffffff"; x.fillRect(0, 0, canvas.width, canvas.height); }
  x.fillStyle = board; x.beginPath(); x.roundRect(0, 0, size, size, 16); x.fill();
  p.grid.forEach((ci, i) => {
    const cx = pad + (i % p.n) * cell + cell / 2, cy = pad + Math.floor(i / p.n) * cell + cell / 2;
    if (ci < 0) {                       // empty peg
      x.fillStyle = hole; x.beginPath(); x.arc(cx, cy, cell * 0.12, 0, 7); x.fill(); return;
    }
    const c = p.colors[ci], r = cell * 0.44;
    x.fillStyle = c.rgb; x.beginPath(); x.roundRect(cx - r, cy - r, 2 * r, 2 * r, r * 0.45); x.fill();
    x.strokeStyle = "rgba(0,0,0,.18)"; x.lineWidth = 2; x.stroke();
    x.fillStyle = luma(c.rgb) > 0.6 ? "rgba(0,0,0,.7)" : "rgba(255,255,255,.92)";  // legend key
    x.font = "700 24px -apple-system, Roboto, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(String(keyOf[ci]), cx, cy + 1);
  });
  if (!withLegend) return;
  let y = size + 40;
  x.fillStyle = "#1d1d1f"; x.textAlign = "left"; x.textBaseline = "alphabetic";
  x.font = "700 24px -apple-system, Roboto, sans-serif";
  x.fillText(`${p.brand} · ${p.n}×${p.n} · ${total(leg)} beads`, pad, y);
  y += 24;
  leg.forEach(c => {
    const cy = y + rowH / 2;
    x.fillStyle = "#6b6b70"; x.font = "500 18px -apple-system, Roboto, sans-serif"; x.textAlign = "right";
    x.fillText(String(c.key), pad + 22, cy + 6);
    x.fillStyle = c.rgb; x.beginPath(); x.roundRect(pad + 32, cy - 14, 28, 28, 6); x.fill();
    x.strokeStyle = "rgba(0,0,0,.2)"; x.lineWidth = 1; x.stroke();
    x.textAlign = "left"; x.fillStyle = "#1d1d1f"; x.font = "700 20px -apple-system, Roboto, sans-serif";
    x.fillText(c.code, pad + 72, cy + 7);
    const w = x.measureText(c.code).width;
    x.fillStyle = "#6b6b70"; x.font = "400 18px -apple-system, Roboto, sans-serif";
    x.fillText(c.name, pad + 82 + w, cy + 7);
    x.fillStyle = "#1d1d1f"; x.font = "700 20px -apple-system, Roboto, sans-serif"; x.textAlign = "right";
    x.fillText("× " + c.count, size - pad, cy + 7);
    y += rowH;
  });
}

const total = leg => leg.reduce((s, c) => s + c.count, 0);

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800);
}

function listText(p, leg) {
  return `${p.brand} bead order (${p.n}×${p.n}, ${total(leg)} beads)\n` +
    leg.map(c => `${c.code}${c.name ? " " + c.name : ""} × ${c.count}`).join("\n");
}

async function saveImage(p, leg) {
  const c = document.createElement("canvas");
  draw(c, p, leg, true);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const file = new File([blob], "bead-pattern.png", { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Bead pattern" }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function copyList(p, leg) {
  const text = listText(p, leg);
  try { await navigator.clipboard.writeText(text); toast("Bead list copied"); }
  catch { prompt("Copy the bead list:", text); }
}

function render() {
  const app = document.getElementById("app");
  let p = null;
  try { p = location.hash.length > 1 ? parse(location.hash) : null; } catch { p = null; }
  if (!p) {
    document.getElementById("sub").textContent = "";
    app.innerHTML = `<div class="card empty">${location.hash.length > 1
      ? "This pattern link looks damaged. Scan the QR code on your bead pad again."
      : "Scan the Export QR code on your bead pad to open a pattern here."}</div>`;
    return;
  }
  const leg = legend(p);
  document.getElementById("title").textContent = `${p.brand} pattern`;
  document.getElementById("sub").textContent =
    `${p.n}×${p.n} board · ${total(leg)} beads · ${leg.length} colour${leg.length === 1 ? "" : "s"}`;
  app.innerHTML = `
    <div class="card"><canvas id="pattern" aria-label="Bead pattern"></canvas></div>
    <div class="actions">
      <button class="primary" id="save">Save image</button>
      <button id="copy">Copy bead list</button>
    </div>
    <div class="card">
      <h2>Beads to order <span>${total(leg)}</span></h2>
      ${leg.length ? "<ol id='leg'></ol>" : "<p class='empty'>No beads placed yet.</p>"}
    </div>`;
  draw(document.getElementById("pattern"), p, leg, false);
  const ol = document.getElementById("leg");
  leg.forEach(c => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="key"></span><span class="sw"></span>
      <span><span class="code"></span> <span class="name"></span></span><span class="count"></span>`;
    li.querySelector(".key").textContent = c.key;
    li.querySelector(".sw").style.background = c.rgb;
    li.querySelector(".code").textContent = c.code;
    li.querySelector(".name").textContent = c.name;
    li.querySelector(".count").textContent = "× " + c.count;
    ol && ol.appendChild(li);
  });
  document.getElementById("save").onclick = () => saveImage(p, leg);
  document.getElementById("copy").onclick = () => copyList(p, leg);
}

window.addEventListener("hashchange", render);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
render();
</script>
</body>
</html>
